[project]
name = "yt-finance-kb"
version = "0.1.0"
description = "Analizza e riassume video YouTube di finanza e trading, con gli screenshot dei grafici citati da chi parla."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "alefaggianidev" }]
dependencies = [
    "google-genai>=2.33",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "yt-dlp[default]>=2026.10.26",
    "deno>=2.0",
    "youtube-transcript-api>=1.2.4",
    "feedparser>=6.0",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Provider di PO token per yt-dlp: serve solo se YouTube blocca i download (vedi documentazione).
pot = ["bgutil-ytdlp-pot-provider>=2.0"]

[project.scripts]
ytkb = "ytkb.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # B008: Typer usa Option() nei default per design
